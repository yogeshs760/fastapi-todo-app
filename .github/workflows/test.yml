name: FastAPI CI Pipeline

# 1. Yeh pipeline kab chalegi? (Jab bhi 'main' branch par push hoga)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 2. Jobs: Kya kya kaam karna hai?
jobs:
  test-our-app:
    # GitHub ek naya Ubuntu (Linux) server (container) rent par lega
    runs-on: ubuntu-latest

    steps:
    # Step 1: Hamara code GitHub se is naye server par download karo
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Server par Python 3.10 install karo
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # Step 3: Requirements file se saari libraries install karo
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    # Step 4: Pytest command run karo
    - name: Run Tests
      run: |
        pytest